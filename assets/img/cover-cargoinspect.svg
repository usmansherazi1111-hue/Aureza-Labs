<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="CargoInspect interface artwork">
  <title>CargoInspect</title>
  <defs>
    <linearGradient id="cargoinspect-ground" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1614"/>
      <stop offset=".55" stop-color="#1a8a7c" stop-opacity=".92"/>
      <stop offset="1" stop-color="#04231f"/>
    </linearGradient>
    <radialGradient id="cargoinspect-glow" cx="0" cy="0" r="1" gradientTransform="translate(620 110) rotate(128) scale(520 470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c97a1f" stop-opacity=".62"/>
      <stop offset="1" stop-color="#c97a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cargoinspect-glow2" cx="0" cy="0" r="1" gradientTransform="translate(120 540) rotate(-42) scale(420 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ecdb9" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4ecdb9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cargoinspect-rule" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="cargoinspect-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="t"><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="t" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#cargoinspect-grain)">
    <rect width="800" height="600" fill="url(#cargoinspect-ground)"/>
    <rect width="800" height="600" fill="url(#cargoinspect-rule)"/>
    <rect width="800" height="600" fill="url(#cargoinspect-glow)"/>
    <rect width="800" height="600" fill="url(#cargoinspect-glow2)"/>
    <rect x="120" y="180" width="560" height="250" rx="12" fill="#fff" fill-opacity=".09" stroke="#fff" stroke-opacity=".3" stroke-width="2"/><line x1="142" y1="184" x2="142" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="174" y1="184" x2="174" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="206" y1="184" x2="206" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="238" y1="184" x2="238" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="270" y1="184" x2="270" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="302" y1="184" x2="302" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="334" y1="184" x2="334" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="366" y1="184" x2="366" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="398" y1="184" x2="398" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="430" y1="184" x2="430" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="462" y1="184" x2="462" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="494" y1="184" x2="494" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="526" y1="184" x2="526" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="558" y1="184" x2="558" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="590" y1="184" x2="590" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="622" y1="184" x2="622" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><line x1="654" y1="184" x2="654" y2="426" stroke="#fff" stroke-opacity=".13" stroke-width="2.4"/><rect x="120" y="180" width="120" height="250" rx="12" fill="#0b1614" fill-opacity=".22"/><path d="M470 240c26 18 14 44 34 58s44-4 56 18" fill="none" stroke="#c97a1f" stroke-width="6" stroke-linecap="round"/><rect x="440" y="212" width="180" height="128" rx="10" fill="none" stroke="#c97a1f" stroke-width="2.6" stroke-dasharray="9 7"/><rect x="440" y="352" width="106" height="26" rx="13" fill="#c97a1f"/><circle cx="180" cy="470" r="22" fill="#fff" fill-opacity=".16"/><circle cx="620" cy="470" r="22" fill="#fff" fill-opacity=".16"/>
