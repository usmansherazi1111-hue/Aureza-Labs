<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="PipeIntegrity interface artwork">
  <title>PipeIntegrity</title>
  <defs>
    <linearGradient id="pipeintegrity-ground" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1614"/>
      <stop offset=".55" stop-color="#0a655c" stop-opacity=".92"/>
      <stop offset="1" stop-color="#04231f"/>
    </linearGradient>
    <radialGradient id="pipeintegrity-glow" cx="0" cy="0" r="1" gradientTransform="translate(620 110) rotate(128) scale(520 470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c97a1f" stop-opacity=".62"/>
      <stop offset="1" stop-color="#c97a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pipeintegrity-glow2" cx="0" cy="0" r="1" gradientTransform="translate(120 540) rotate(-42) scale(420 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ecdb9" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4ecdb9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pipeintegrity-rule" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="pipeintegrity-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="t"><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="t" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#pipeintegrity-grain)">
    <rect width="800" height="600" fill="url(#pipeintegrity-ground)"/>
    <rect width="800" height="600" fill="url(#pipeintegrity-rule)"/>
    <rect width="800" height="600" fill="url(#pipeintegrity-glow)"/>
    <rect width="800" height="600" fill="url(#pipeintegrity-glow2)"/>
    <rect x="60" y="210" width="680" height="180" rx="90" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".26" stroke-width="1.8"/><line x1="100" y1="216" x2="100" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><line x1="148" y1="216" x2="148" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><line x1="196" y1="216" x2="196" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><line x1="244" y1="216" x2="244" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><line x1="292" y1="216" x2="292" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><line x1="340" y1="216" x2="340" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><line x1="388" y1="216" x2="388" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><line x1="436" y1="216" x2="436" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><line x1="484" y1="216" x2="484" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><line x1="532" y1="216" x2="532" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><line x1="580" y1="216" x2="580" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><line x1="628" y1="216" x2="628" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><line x1="676" y1="216" x2="676" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><line x1="724" y1="216" x2="724" y2="384" stroke="#fff" stroke-opacity=".12" stroke-width="1.4"/><ellipse cx="500" cy="300" rx="46" ry="34" fill="#c97a1f" fill-opacity=".92"/><ellipse cx="500" cy="300" rx="74" ry="56" fill="none" stroke="#c97a1f" stroke-width="2.4" stroke-opacity=".5"/><ellipse cx="248" cy="300" rx="22" ry="16" fill="#fff" fill-opacity=".38"/><rect x="180" y="440" width="52" height="30" rx="6" fill="#fff" fill-opacity="0.18"/><rect x="276" y="424" width="52" height="46" rx="6" fill="#fff" fill-opacity="0.18"/><rect x="372" y="404" width="52" height="66" rx="6" fill="#fff" fill-opacity="0.18"/><rect x="468" y="374" width="52" height="96" rx="6" fill="#fff" fill-opacity="0.18"/><rect x="564" y="338" width="52" height="132" rx="6" fill="#c97a1f" fill-opacity="0.9"/>
  </g>
</svg>