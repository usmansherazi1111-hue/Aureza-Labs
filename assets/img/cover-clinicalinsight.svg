<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="ClinicalInsight interface artwork">
  <title>ClinicalInsight</title>
  <defs>
    <linearGradient id="clinicalinsight-ground" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1614"/>
      <stop offset=".55" stop-color="#0e7f72" stop-opacity=".92"/>
      <stop offset="1" stop-color="#04231f"/>
    </linearGradient>
    <radialGradient id="clinicalinsight-glow" cx="0" cy="0" r="1" gradientTransform="translate(620 110) rotate(128) scale(520 470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a86b5" stop-opacity=".62"/>
      <stop offset="1" stop-color="#3a86b5" stop-opacity="0"/>
