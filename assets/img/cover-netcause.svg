<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="NetCause interface artwork">
  <title>NetCause</title>
  <defs>
    <linearGradient id="netcause-ground" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1614"/>
      <stop offset=".55" stop-color="#1a8a7c" stop-opacity=".92"/>
      <stop offset="1" stop-color="#04231f"/>
    </linearGradient>
    <radialGradient id="netcause-glow" cx="0" cy="0" r="1" gradientTransform="translate(620 110) rotate(128) scale(520 470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a86b5" stop-opacity=".62"/>
      <stop offset="1" stop-color="#3a86b5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="netcause-glow2" cx="0" cy="0" r="1" gradientTransform="translate(120 540) rotate(-42) scale(420 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ecdb9" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4ecdb9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="netcause-rule" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="netcause-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="t"><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="t" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#netcause-grain)">
    <rect width="800" height="600" fill="url(#netcause-ground)"/>
    <rect width="800" height="600" fill="url(#netcause-rule)"/>
    <rect width="800" height="600" fill="url(#netcause-glow)"/>
    <rect width="800" height="600" fill="url(#netcause-glow2)"/>
    <line x1="400" y1="120" x2="210" y2="250"
        stroke="#3a86b5" stroke-opacity="0.75" stroke-width="3"/><line x1="400" y1="120" x2="590" y2="250"
        stroke="#fff" stroke-opacity="0.22" stroke-width="1.8"/><line x1="210" y1="250" x2="130" y2="410"
        stroke="#3a86b5" stroke-opacity="0.75" stroke-width="3"/><line x1="210" y1="250" x2="320" y2="410"
        stroke="#3a86b5" stroke-opacity="0.75" stroke-width="3"/><line x1="590" y1="250" x2="490" y2="410"
        stroke="#fff" stroke-opacity="0.22" stroke-width="1.8"/><line x1="590" y1="250" x2="670" y2="410"
        stroke="#fff" stroke-opacity="0.22" stroke-width="1.8"/><line x1="320" y1="410" x2="240" y2="530"
        stroke="#fff" stroke-opacity="0.22" stroke-width="1.8"/><line x1="490" y1="410" x2="560" y2="530"
        stroke="#fff" stroke-opacity="0.22" stroke-width="1.8"/><line x1="130" y1="410" x2="240" y2="530"
        stroke="#fff" stroke-opacity="0.22" stroke-width="1.8"/><line x1="670" y1="410" x2="560" y2="530"
        stroke="#fff" stroke-opacity="0.22" stroke-width="1.8"/><circle cx="400" cy="120" r="22" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity=".34" stroke-width="1.5"/><circle cx="210" cy="250" r="34" fill="#3a86b5" fill-opacity="0.95" stroke="#fff" stroke-opacity=".34" stroke-width="1.5"/><path d="M199 239l22 22M221 239l-22 22" stroke="#0b1614" stroke-width="3.4" stroke-linecap="round"/><circle cx="590" cy="250" r="22" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity=".34" stroke-width="1.5"/><circle cx="130" cy="410" r="22" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity=".34" stroke-width="1.5"/><circle cx="320" cy="410" r="22" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity=".34" stroke-width="1.5"/><circle cx="490" cy="410" r="22" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity=".34" stroke-width="1.5"/><circle cx="670" cy="410" r="22" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity=".34" stroke-width="1.5"/><circle cx="240" cy="530" r="22" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity=".34" stroke-width="1.5"/><circle cx="560" cy="530" r="22" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity=".34" stroke-width="1.5"/>
  </g>
</svg>